<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-label="快照结构示意">
  <defs>
    <style>
      text { font-family: "Microsoft YaHei","PingFang SC",sans-serif; }
      .nt  { font-size:16px; font-weight:700; fill:#1a2635; }
      .nl  { font-size:13px; font-weight:600; fill:#1a2635; }
      .ns  { font-size:11px; fill:#5a7080; }
      .nc  { font-size:10.5px; font-family:"Consolas","Courier New",monospace; fill:#1a2635; }
      .nok { font-size:10.5px; fill:#166534; }
      .nmiss { font-size:10.5px; fill:#7c3a00; }
      .nfail { font-size:10.5px; fill:#7f1d1d; }
      .hc  { font-size:10px; font-family:"Consolas","Courier New",monospace; fill:#c8d8e8; }
    </style>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000015"/></filter>
  </defs>

  <!-- Title -->
  <text class="nt" x="450" y="28" text-anchor="middle">KVX样例程序_v100 — 快照摘要（真实输出）</text>

  <!-- Stats bar -->
  <rect fill="#f0f4f9" stroke="#d8e2ee" stroke-width="1" x="20" y="42" width="860" height="50" rx="8"/>
  <text class="nl" x="120" y="62" text-anchor="middle">实体总数</text>
  <text font-size="24" font-weight="700" fill="#1a5fa0" x="120" y="84" text-anchor="middle">86</text>
  <line x1="210" y1="50" x2="210" y2="84" stroke="#d8e2ee" stroke-width="1"/>
  <text class="nl" x="300" y="62" text-anchor="middle">complete</text>
  <text font-size="24" font-weight="700" fill="#166534" x="300" y="84" text-anchor="middle">61</text>
  <line x1="390" y1="50" x2="390" y2="84" stroke="#d8e2ee" stroke-width="1"/>
  <text class="nl" x="480" y="62" text-anchor="middle">missing</text>
  <text font-size="24" font-weight="700" fill="#7c3a00" x="480" y="84" text-anchor="middle">23</text>
  <line x1="570" y1="50" x2="570" y2="84" stroke="#d8e2ee" stroke-width="1"/>
  <text class="nl" x="650" y="62" text-anchor="middle">failed</text>
  <text font-size="24" font-weight="700" fill="#7f1d1d" x="650" y="84" text-anchor="middle">1</text>
  <line x1="730" y1="50" x2="730" y2="84" stroke="#d8e2ee" stroke-width="1"/>
  <text class="nl" x="810" y="62" text-anchor="middle">warnings</text>
  <text font-size="24" font-weight="700" fill="#7c5800" x="810" y="84" text-anchor="middle">25</text>

  <!-- 配置 group -->
  <rect fill="#dce8f5" stroke="#1a5fa0" stroke-width="1.5" x="20" y="108" width="415" height="165" rx="8" filter="url(#sh)"/>
  <text class="nl" x="227" y="128" text-anchor="middle" fill="#0e3d6b">配置 (config) — restore order 10→20→30→40</text>
  <line x1="30" y1="136" x2="425" y2="136" stroke="#c8d8f0" stroke-width="1"/>
  <text class="nc" x="36" y="156">✅  config:单元</text>
  <text class="nok" x="220" y="156">complete · unit_configuration</text>
  <text class="nc" x="36" y="176">✅  config:EtherCAT</text>
  <text class="nok" x="220" y="176">complete · ethercat_configuration</text>
  <text class="nc" x="36" y="196">✅  config:全局变量</text>
  <text class="nok" x="220" y="196">complete · global_variables</text>
  <text class="nc" x="36" y="216">✅  types:structure_definitions</text>
  <text class="nok" x="220" y="216">complete · data_types</text>
  <text class="ns" x="227" y="260" text-anchor="middle">所有 FB 和程序依赖此组先恢复</text>

  <!-- 功能块 group -->
  <rect fill="#eaf4ee" stroke="#2a6e4a" stroke-width="1.5" x="20" y="288" width="415" height="210" rx="8" filter="url(#sh)"/>
  <text class="nl" x="227" y="308" text-anchor="middle" fill="#1a4a28">功能块 FB（共 25 个）— restore order 50</text>
  <line x1="30" y1="316" x2="425" y2="316" stroke="#c8e8d8" stroke-width="1"/>
  <text class="nc"    x="36" y="336">✅  fb:功能块/level1_组件/FB_Cylinder</text>
  <text class="nok"   x="310" y="336">气缸控制</text>
  <text class="nc"    x="36" y="356">✅  fb:功能块/level1_组件/FB_Motion</text>
  <text class="nok"   x="310" y="356">运动控制</text>
  <text class="nc"    x="36" y="376">✅  fb:功能块/level1_组件/FB_Vacuum</text>
  <text class="nok"   x="310" y="376">真空控制</text>
  <text class="nc"    x="36" y="396">✅  fb:功能块/库/MC_*_YASKA_SigmaXS_V100</text>
  <text class="nok"   x="310" y="396">×7</text>
  <text class="nc"    x="36" y="416">✅  fb:功能块/库/ModbusTCPClient_*</text>
  <text class="nok"   x="310" y="416">Connect / Command</text>
  <text class="nc"    x="36" y="436">❌  fb:功能块/level3_设备/FB_McMode</text>
  <text class="nfail" x="310" y="436">failed</text>
  <text class="ns"    x="227" y="482" text-anchor="middle">strategy: import_body_then_set_arguments_then_set_locals</text>

  <!-- 程序 group -->
  <rect fill="#f2ecfb" stroke="#5a3a8a" stroke-width="1.5" x="455" y="108" width="425" height="200" rx="8" filter="url(#sh)"/>
  <text class="nl" x="667" y="128" text-anchor="middle" fill="#3a1a6a">程序模块（共 24 个）— restore order 60</text>
  <line x1="465" y1="136" x2="870" y2="136" stroke="#d8c8f8" stroke-width="1"/>
  <text class="nc"    x="470" y="156">✅  program:每次扫描/ST00_插针_演示</text>
  <text class="nok"   x="750" y="156">complete</text>
  <text class="nc"    x="470" y="176">✅  program:每次扫描/ST04_传送带</text>
  <text class="nok"   x="750" y="176">complete</text>
  <text class="nc"    x="470" y="196">✅  program:每次扫描/ST05_旋转点胶</text>
  <text class="nok"   x="750" y="196">complete</text>
  <text class="nc"    x="470" y="216">⚠️  program:每次扫描/IO输入</text>
  <text class="nmiss" x="750" y="216">missing</text>
  <text class="nc"    x="470" y="236">⚠️  program:每次扫描/IO输出</text>
  <text class="nmiss" x="750" y="236">missing</text>
  <text class="nc"    x="470" y="256">⚠️  program:每次扫描/HMI … 共 23 个 missing</text>
  <text class="ns"    x="667" y="292" text-anchor="middle">依赖 FB + 全局变量先就位</text>

  <!-- entity.json example -->
  <rect fill="#1a2635" stroke="#0e1f30" stroke-width="1" x="455" y="328" width="425" height="170" rx="8" filter="url(#sh)"/>
  <text font-size="12" font-weight="600" fill="#7baed4" x="667" y="350" text-anchor="middle">entity.json 示例 — FB_Cylinder</text>
  <line x1="465" y1="358" x2="870" y2="358" stroke="rgba(255,255,255,.1)" stroke-width="1"/>
  <text class="hc" x="468" y="376">"id": "fb:功能块/level1_组件/FB_Cylinder",</text>
  <text class="hc" x="468" y="393">"display_name": "气缸控制",</text>
  <text class="hc" x="468" y="410">"restore": {</text>
  <text class="hc" x="468" y="427">  "order": 50,</text>
  <text class="hc" x="468" y="444">  "strategy": "import_body_then_set_arguments_then_set_locals",</text>
  <text class="hc" x="468" y="461">  "depends_on": ["types:structure_definitions", "config:全局变量"]</text>
  <text font-size="10" font-family="Consolas,monospace" fill="#7baed4" x="468" y="478">"status": { "body": "complete", "arguments": "complete", "locals": "complete" }</text>
</svg>
