<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 710" preserveAspectRatio="xMidYMid meet" role="img" aria-label="FB_Cylinder功能块完整内容">
  <defs>
    <style>
      text { font-family: "Microsoft YaHei","PingFang SC","Segoe UI",Arial,sans-serif; }
      .ttl { font-size:14px; font-weight:700; fill:#1a2635; }
      .sub { font-size:10px; fill:#5a7080; }
      .hdr { font-size:11px; font-weight:700; fill:#fff; }
      .col { font-size:9px; font-weight:600; fill:#6a8090; }
      .cod { font-size:9px; font-family:"Consolas","Courier New",monospace; fill:#1a2635; }
      .cW  { font-size:9px; font-family:"Consolas","Courier New",monospace; fill:#c8d8e8; }
      .cmt { font-size:9px; font-family:"Consolas","Courier New",monospace; fill:#7baed4; }
      .tag { font-size:8px; font-weight:700; fill:#fff; }
      .ok  { font-size:9px; fill:#166534; }
    </style>
    <filter id="sh"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#00000014"/></filter>
  </defs>

  <!-- Title -->
  <text class="ttl" x="400" y="20" text-anchor="middle">FB_Cylinder 功能块 — 完整内容一览</text>
  <text class="sub" x="400" y="35" text-anchor="middle">三份文件共同描述一个功能块的全部信息，AI 读取后具备完整上下文</text>

  <!-- ══════════════════════════════════════════
       ROW 1: Panel ① Arguments — full width 776px
  ═══════════════════════════════════════════════ -->
  <rect fill="#1a5fa0" x="12" y="44" width="776" height="20" rx="5"/>
  <text class="hdr" x="400" y="58" text-anchor="middle">① 自变量 arguments.tsv — 功能块对外接口</text>
  <rect fill="#f0f7ff" stroke="#7baed4" stroke-width="1" x="12" y="64" width="776" height="230" rx="5" filter="url(#sh)"/>

  <!-- Column headers: 变量名(x=20,w=180) 方向(x=210,w=60) 类型(x=280,w=180) 注释(x=470) -->
  <text class="col" x="20"  y="78">变量名</text>
  <text class="col" x="210" y="78">方向</text>
  <text class="col" x="280" y="78">类型</text>
  <text class="col" x="470" y="78">注释</text>
  <line x1="16" y1="82" x2="784" y2="82" stroke="#c8d8f0" stroke-width="1"/>

  <!-- IN-OUT rows -->
  <rect fill="#1a5fa0" x="210" y="87" width="44" height="11" rx="2"/>
  <text class="tag" x="232" y="96" text-anchor="middle">IN-OUT</text>
  <text class="cod" x="20" y="96">CylinderCtrl</text>
  <text class="cod" x="280" y="96">strCylinderCtrl</text>
  <text class="sub" x="470" y="96">气缸控制命令（手动/自动执行标志）</text>

  <rect fill="#1a5fa0" x="210" y="101" width="44" height="11" rx="2"/>
  <text class="tag" x="232" y="110" text-anchor="middle">IN-OUT</text>
  <text class="cod" x="20" y="110">CylinderParam</text>
  <text class="cod" x="280" y="110">strCylinderParam</text>
  <text class="sub" x="470" y="110">气缸参数（防抖时间、超时时间）</text>

  <rect fill="#1a5fa0" x="210" y="115" width="44" height="11" rx="2"/>
  <text class="tag" x="232" y="124" text-anchor="middle">IN-OUT</text>
  <text class="cod" x="20" y="124">CylinderStatus</text>
  <text class="cod" x="280" y="124">strCylinderStatus</text>
  <text class="sub" x="470" y="124">气缸状态（就绪、运动中、到位）</text>

  <line x1="16" y1="129" x2="784" y2="129" stroke="#dce8f8" stroke-width="1"/>

  <!-- IN rows -->
  <rect fill="#2a6e4a" x="210" y="133" width="24" height="11" rx="2"/>
  <text class="tag" x="222" y="142" text-anchor="middle">IN</text>
  <text class="cod" x="20" y="142">MachineStatus</text>
  <text class="cod" x="280" y="142">strMachineStatus</text>
  <text class="sub" x="470" y="142">设备整体状态（自动/手动/报警）</text>

  <rect fill="#2a6e4a" x="210" y="147" width="24" height="11" rx="2"/>
  <text class="tag" x="222" y="156" text-anchor="middle">IN</text>
  <text class="cod" x="20" y="156">InHomeSensorMaster</text>
  <text class="cod" x="280" y="156">BOOL</text>
  <text class="sub" x="470" y="156">原位传感器 1（主）</text>

  <rect fill="#2a6e4a" x="210" y="161" width="24" height="11" rx="2"/>
  <text class="tag" x="222" y="170" text-anchor="middle">IN</text>
  <text class="cod" x="20" y="170">InWorkSensorMaster</text>
  <text class="cod" x="280" y="170">BOOL</text>
  <text class="sub" x="470" y="170">动位传感器 1（主）</text>

  <rect fill="#2a6e4a" x="210" y="175" width="24" height="11" rx="2"/>
  <text class="tag" x="222" y="184" text-anchor="middle">IN</text>
  <text class="cod" x="20" y="184">InHomeSensorSlave</text>
  <text class="cod" x="280" y="184">BOOL</text>
  <text class="sub" x="470" y="184">原位传感器 2（从）</text>

  <rect fill="#2a6e4a" x="210" y="189" width="24" height="11" rx="2"/>
  <text class="tag" x="222" y="198" text-anchor="middle">IN</text>
  <text class="cod" x="20" y="198">InWorkSensorSlave</text>
  <text class="cod" x="280" y="198">BOOL</text>
  <text class="sub" x="470" y="198">动位传感器 2（从）</text>

  <rect fill="#2a6e4a" x="210" y="203" width="24" height="11" rx="2"/>
  <text class="tag" x="222" y="212" text-anchor="middle">IN</text>
  <text class="cod" x="20" y="212">Reset</text>
  <text class="cod" x="280" y="212">BOOL</text>
  <text class="sub" x="470" y="212">复位</text>

  <line x1="16" y1="217" x2="784" y2="217" stroke="#dce8f8" stroke-width="1"/>

  <!-- OUT rows -->
  <rect fill="#7c3a00" x="210" y="221" width="30" height="11" rx="2"/>
  <text class="tag" x="225" y="230" text-anchor="middle">OUT</text>
  <text class="cod" x="20" y="230">OutToWork</text>
  <text class="cod" x="280" y="230">BOOL</text>
  <text class="sub" x="470" y="230">输出去工作位</text>

  <rect fill="#7c3a00" x="210" y="235" width="30" height="11" rx="2"/>
  <text class="tag" x="225" y="244" text-anchor="middle">OUT</text>
  <text class="cod" x="20" y="244">OutToHome</text>
  <text class="cod" x="280" y="244">BOOL</text>
  <text class="sub" x="470" y="244">输出回原点位</text>

  <rect fill="#7c3a00" x="210" y="249" width="30" height="11" rx="2"/>
  <text class="tag" x="225" y="258" text-anchor="middle">OUT</text>
  <text class="cod" x="20" y="258">Error</text>
  <text class="cod" x="280" y="258">BOOL</text>
  <text class="sub" x="470" y="258">错误标志</text>

  <rect fill="#7c3a00" x="210" y="263" width="30" height="11" rx="2"/>
  <text class="tag" x="225" y="272" text-anchor="middle">OUT</text>
  <text class="cod" x="20" y="272">ErrorID</text>
  <text class="cod" x="280" y="272">UINT</text>
  <text class="sub" x="470" y="272">错误代码（1=原点超时 2=工作位超时 3=双传感器）</text>

  <!-- ══════════════════════════════════════════
       ROW 2 LEFT: Panel ② Locals — 376px wide
  ═══════════════════════════════════════════════ -->
  <rect fill="#5a3a8a" x="12" y="280" width="376" height="20" rx="5"/>
  <text class="hdr" x="200" y="294" text-anchor="middle">② 局部变量 locals.tsv — 内部状态</text>
  <rect fill="#f8f4ff" stroke="#c8b8f8" stroke-width="1" x="12" y="300" width="376" height="330" rx="5" filter="url(#sh)"/>

  <text class="col" x="20"  y="314">变量名</text>
  <text class="col" x="180" y="314">类型</text>
  <text class="col" x="240" y="314">注释</text>
  <line x1="16" y1="318" x2="384" y2="318" stroke="#d8c8f8" stroke-width="1"/>

  <text class="cod" x="20" y="332">bTimeOut</text>      <text class="cod" x="180" y="332">BOOL</text>  <text class="sub" x="240" y="332">动作超时报警定时器</text>
  <text class="cod" x="20" y="348">bTimeHome</text>     <text class="cod" x="180" y="348">BOOL</text>  <text class="sub" x="240" y="348">回原位防抖动定时器</text>
  <text class="cod" x="20" y="364">bTimeWork</text>     <text class="cod" x="180" y="364">BOOL</text>  <text class="sub" x="240" y="364">工作位防抖动定时器</text>
  <text class="cod" x="20" y="380">bTimeNA</text>       <text class="cod" x="180" y="380">BOOL</text>  <text class="sub" x="240" y="380">两传感器都无信号延时</text>
  <text class="cod" x="20" y="396">bTimeHave</text>     <text class="cod" x="180" y="396">BOOL</text>  <text class="sub" x="240" y="396">两传感器都有信号延时</text>
  <text class="cod" x="20" y="412">bFault1</text>       <text class="cod" x="180" y="412">BOOL</text>  <text class="sub" x="240" y="412">回原点位置超时</text>
  <text class="cod" x="20" y="428">bFault2</text>       <text class="cod" x="180" y="428">BOOL</text>  <text class="sub" x="240" y="428">回工作位置超时</text>
  <text class="cod" x="20" y="444">bFault3</text>       <text class="cod" x="180" y="444">BOOL</text>  <text class="sub" x="240" y="444">两传感器都有信号</text>
  <text class="cod" x="20" y="460">bFault4</text>       <text class="cod" x="180" y="460">BOOL</text>  <text class="sub" x="240" y="460">两传感器都无信号</text>
  <text class="cod" x="20" y="476">bOutHome</text>      <text class="cod" x="180" y="476">BOOL</text>  <text class="sub" x="240" y="476">气缸输出_原位</text>
  <text class="cod" x="20" y="492">bOutWork</text>      <text class="cod" x="180" y="492">BOOL</text>  <text class="sub" x="240" y="492">气缸输出_到位</text>
  <text class="cod" x="20" y="508">duHomeDebounce</text><text class="cod" x="180" y="508">UDINT</text> <text class="sub" x="240" y="508">原位防抖动时间(0.01s)</text>
  <text class="cod" x="20" y="524">duWorkDebounce</text><text class="cod" x="180" y="524">UDINT</text> <text class="sub" x="240" y="524">工作位防抖动时间(0.01s)</text>

  <text class="ok" x="20" y="550">✅ 15 个局部变量完整提取</text>
  <text class="sub" x="20" y="564">AI 修改 FB 时不会产生命名冲突</text>

  <!-- ══════════════════════════════════════════
       ROW 2 RIGHT: Panel ③ Body — 376px wide
  ═══════════════════════════════════════════════ -->
  <rect fill="#1a2635" x="412" y="280" width="376" height="20" rx="5"/>
  <text class="hdr" x="600" y="294" text-anchor="middle">③ 程序体 body.mnm — 梯形图逻辑</text>
  <rect fill="#0f1923" stroke="#2a3a50" stroke-width="1" x="412" y="300" width="376" height="330" rx="5" filter="url(#sh)"/>

  <text font-size="9" font-weight="600" fill="#7baed4" font-family="Consolas,monospace" x="420" y="316">;MODULE: FB_Cylinder   DEVICE: 60</text>
  <line x1="416" y1="320" x2="784" y2="320" stroke="rgba(255,255,255,.1)" stroke-width="1"/>

  <text class="cmt" x="420" y="334">;── 手动/自动上升沿触发 ──────────────────</text>
  <text class="cW"  x="420" y="348">LDP  CylinderCtrl.bExeToWorkManual</text>
  <text class="cW"  x="420" y="362">OUT  bManlWorkUp</text>
  <text class="cW"  x="420" y="376">LDP  CylinderCtrl.bExeToWorkAuto</text>
  <text class="cW"  x="420" y="390">OUT  bAutoWorkUp</text>
  <text class="cW"  x="420" y="404">LDP  CylinderCtrl.bExeToHomeManual</text>
  <text class="cW"  x="420" y="418">OUT  bManlHomeUp</text>

  <text class="cmt" x="420" y="436">;── 自复位（脉冲消除）────────────────────</text>
  <text class="cW"  x="420" y="450">LD   CylinderCtrl.bExeToWorkManual</text>
  <text class="cW"  x="420" y="464">ANB  bManlWorkUp</text>
  <text class="cW"  x="420" y="478">RES  CylinderCtrl.bExeToWorkManual</text>

  <text class="cmt" x="420" y="496">;── 设备状态判断 ──────────────────────────</text>
  <text class="cW"  x="420" y="510">LDB  MachineStatus.bAuto</text>
  <text class="cW"  x="420" y="524">ANDNB bFault1</text>
  <text class="cW"  x="420" y="538">ANDNB bFault2</text>
  <text class="cW"  x="420" y="552">OUT  CylinderStatus.bReady</text>

  <text font-size="9" fill="#7baed4" font-family="Consolas,monospace" x="420" y="574">✅ 基恩士专有指令原文：LDP / ANB / RES / LDB</text>

  <!-- Bottom summary bar -->
  <rect fill="#0e3d6b" x="12" y="644" width="776" height="28" rx="6"/>
  <text font-size="11" font-weight="700" fill="#fff" x="400" y="658" text-anchor="middle">三份文件 · 一个功能块 · AI 得到完整的接口定义、内部状态与程序逻辑</text>
  <text font-size="9" fill="rgba(255,255,255,.7)" x="400" y="668" text-anchor="middle">arguments.tsv（接口）· locals.tsv（内部状态）· body.mnm（梯形图）— 三者合一，AI 可完整理解并修改该 FB</text>
</svg>
