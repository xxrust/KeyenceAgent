<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" preserveAspectRatio="xMidYMid meet" role="img" aria-label="FB_Cylinder功能块完整内容">
  <defs>
    <style>
      text { font-family: "Microsoft YaHei","PingFang SC","Segoe UI",Arial,sans-serif; }
      .ttl { font-size:14px; font-weight:700; fill:#1a2635; }
      .sub { font-size:10px; fill:#5a7080; }
      .hdr { font-size:11px; font-weight:700; fill:#fff; }
      .col { font-size:9px; font-weight:600; fill:#6a8090; }
      .cod { font-size:9px; font-family:"Consolas","Courier New",monospace; fill:#1a2635; }
      .cW  { font-size:9px; font-family:"Consolas","Courier New",monospace; fill:#c8d8e8; }
      .cmt { font-size:9px; font-family:"Consolas","Courier New",monospace; fill:#7baed4; }
      .tag { font-size:8px; font-weight:700; fill:#fff; }
      .ok  { font-size:10px; fill:#166534; }
    </style>
    <filter id="sh"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#00000014"/></filter>
  </defs>

  <!-- Title -->
  <text class="ttl" x="400" y="22" text-anchor="middle">FB_Cylinder 功能块 — 完整内容一览</text>
  <text class="sub" x="400" y="38" text-anchor="middle">三份文件共同描述一个功能块的全部信息，AI 读取后具备完整上下文</text>

  <!-- ── Panel 1: Arguments ── x=12, w=246 -->
  <rect fill="#1a5fa0" x="12" y="48" width="246" height="20" rx="5"/>
  <text class="hdr" x="135" y="62" text-anchor="middle">① 自变量 arguments.tsv</text>
  <rect fill="#f0f7ff" stroke="#7baed4" stroke-width="1" x="12" y="68" width="246" height="488" rx="5" filter="url(#sh)"/>

  <text class="col" x="18" y="82">变量名</text>
  <text class="col" x="128" y="82">方向</text>
  <text class="col" x="176" y="82">类型</text>
  <text class="col" x="226" y="82">注</text>
  <line x1="16" y1="86" x2="254" y2="86" stroke="#c8d8f0" stroke-width="1"/>

  <!-- IN-OUT rows y=104,122,140 -->
  <rect fill="#1a5fa0" x="128" y="91" width="40" height="11" rx="2"/>
  <text class="tag" x="148" y="100" text-anchor="middle">IN-OUT</text>
  <text class="cod" x="18" y="100">CylinderCtrl</text>
  <text class="cod" x="176" y="100">strCylCtrl</text>
  <text class="sub" x="226" y="100">控制</text>

  <rect fill="#1a5fa0" x="128" y="105" width="40" height="11" rx="2"/>
  <text class="tag" x="148" y="114" text-anchor="middle">IN-OUT</text>
  <text class="cod" x="18" y="114">CylinderParam</text>
  <text class="cod" x="176" y="114">strCylParam</text>
  <text class="sub" x="226" y="114">参数</text>

  <rect fill="#1a5fa0" x="128" y="119" width="40" height="11" rx="2"/>
  <text class="tag" x="148" y="128" text-anchor="middle">IN-OUT</text>
  <text class="cod" x="18" y="128">CylinderStatus</text>
  <text class="cod" x="176" y="128">strCylStatus</text>
  <text class="sub" x="226" y="128">状态</text>

  <line x1="16" y1="133" x2="254" y2="133" stroke="#dce8f8" stroke-width="1"/>

  <!-- IN rows -->
  <rect fill="#2a6e4a" x="128" y="137" width="22" height="11" rx="2"/>
  <text class="tag" x="139" y="146" text-anchor="middle">IN</text>
  <text class="cod" x="18" y="146">MachineStatus</text>
  <text class="cod" x="176" y="146">strMachine</text>
  <text class="sub" x="226" y="146">设备状态</text>

  <rect fill="#2a6e4a" x="128" y="151" width="22" height="11" rx="2"/>
  <text class="tag" x="139" y="160" text-anchor="middle">IN</text>
  <text class="cod" x="18" y="160">InHomeSensorMaster</text>
  <text class="cod" x="176" y="160">BOOL</text>
  <text class="sub" x="226" y="160">原位1</text>

  <rect fill="#2a6e4a" x="128" y="165" width="22" height="11" rx="2"/>
  <text class="tag" x="139" y="174" text-anchor="middle">IN</text>
  <text class="cod" x="18" y="174">InWorkSensorMaster</text>
  <text class="cod" x="176" y="174">BOOL</text>
  <text class="sub" x="226" y="174">动位1</text>

  <rect fill="#2a6e4a" x="128" y="179" width="22" height="11" rx="2"/>
  <text class="tag" x="139" y="188" text-anchor="middle">IN</text>
  <text class="cod" x="18" y="188">InHomeSensorSlave</text>
  <text class="cod" x="176" y="188">BOOL</text>
  <text class="sub" x="226" y="188">原位2</text>

  <rect fill="#2a6e4a" x="128" y="193" width="22" height="11" rx="2"/>
  <text class="tag" x="139" y="202" text-anchor="middle">IN</text>
  <text class="cod" x="18" y="202">InWorkSensorSlave</text>
  <text class="cod" x="176" y="202">BOOL</text>
  <text class="sub" x="226" y="202">动位2</text>

  <rect fill="#2a6e4a" x="128" y="207" width="22" height="11" rx="2"/>
  <text class="tag" x="139" y="216" text-anchor="middle">IN</text>
  <text class="cod" x="18" y="216">Reset</text>
  <text class="cod" x="176" y="216">BOOL</text>
  <text class="sub" x="226" y="216">复位</text>

  <line x1="16" y1="221" x2="254" y2="221" stroke="#dce8f8" stroke-width="1"/>

  <!-- OUT rows -->
  <rect fill="#7c3a00" x="128" y="225" width="28" height="11" rx="2"/>
  <text class="tag" x="142" y="234" text-anchor="middle">OUT</text>
  <text class="cod" x="18" y="234">OutToWork</text>
  <text class="cod" x="176" y="234">BOOL</text>
  <text class="sub" x="226" y="234">去工作位</text>

  <rect fill="#7c3a00" x="128" y="239" width="28" height="11" rx="2"/>
  <text class="tag" x="142" y="248" text-anchor="middle">OUT</text>
  <text class="cod" x="18" y="248">OutToHome</text>
  <text class="cod" x="176" y="248">BOOL</text>
  <text class="sub" x="226" y="248">回原点</text>

  <rect fill="#7c3a00" x="128" y="253" width="28" height="11" rx="2"/>
  <text class="tag" x="142" y="262" text-anchor="middle">OUT</text>
  <text class="cod" x="18" y="262">Error</text>
  <text class="cod" x="176" y="262">BOOL</text>
  <text class="sub" x="226" y="262">错误</text>

  <rect fill="#7c3a00" x="128" y="267" width="28" height="11" rx="2"/>
  <text class="tag" x="142" y="276" text-anchor="middle">OUT</text>
  <text class="cod" x="18" y="276">ErrorID</text>
  <text class="cod" x="176" y="276">UINT</text>
  <text class="sub" x="226" y="276">错误代码</text>

  <text class="ok" x="18" y="298">✅ 13个接口变量完整提取</text>
  <text class="sub" x="18" y="312">方向 / 类型 / 注释全部保留</text>

  <!-- ── Panel 2: Locals ── x=270, w=246 -->
  <rect fill="#5a3a8a" x="270" y="48" width="246" height="20" rx="5"/>
  <text class="hdr" x="393" y="62" text-anchor="middle">② 局部变量 locals.tsv</text>
  <rect fill="#f8f4ff" stroke="#c8b8f8" stroke-width="1" x="270" y="68" width="246" height="488" rx="5" filter="url(#sh)"/>

  <text class="col" x="278" y="82">变量名</text>
  <text class="col" x="380" y="82">类型</text>
  <text class="col" x="424" y="82">注释</text>
  <line x1="274" y1="86" x2="512" y2="86" stroke="#d8c8f8" stroke-width="1"/>

  <text class="cod" x="278" y="100">bTimeOut</text>     <text class="cod" x="380" y="100">BOOL</text>  <text class="sub" x="424" y="100">动作超时定时器</text>
  <text class="cod" x="278" y="118">bTimeHome</text>    <text class="cod" x="380" y="118">BOOL</text>  <text class="sub" x="424" y="118">回原位防抖定时器</text>
  <text class="cod" x="278" y="136">bTimeWork</text>    <text class="cod" x="380" y="136">BOOL</text>  <text class="sub" x="424" y="136">工作位防抖定时器</text>
  <text class="cod" x="278" y="154">bTimeNA</text>      <text class="cod" x="380" y="154">BOOL</text>  <text class="sub" x="424" y="154">两传感器无信号延时</text>
  <text class="cod" x="278" y="172">bTimeHave</text>    <text class="cod" x="380" y="172">BOOL</text>  <text class="sub" x="424" y="172">两传感器有信号延时</text>
  <text class="cod" x="278" y="190">bFault1</text>      <text class="cod" x="380" y="190">BOOL</text>  <text class="sub" x="424" y="190">回原点位置超时</text>
  <text class="cod" x="278" y="208">bFault2</text>      <text class="cod" x="380" y="208">BOOL</text>  <text class="sub" x="424" y="208">回工作位置超时</text>
  <text class="cod" x="278" y="226">bFault3</text>      <text class="cod" x="380" y="226">BOOL</text>  <text class="sub" x="424" y="226">两传感器都有信号</text>
  <text class="cod" x="278" y="244">bFault4</text>      <text class="cod" x="380" y="244">BOOL</text>  <text class="sub" x="424" y="244">两传感器都无信号</text>
  <text class="cod" x="278" y="262">bOutHome</text>     <text class="cod" x="380" y="262">BOOL</text>  <text class="sub" x="424" y="262">气缸输出_原位</text>
  <text class="cod" x="278" y="280">bOutWork</text>     <text class="cod" x="380" y="280">BOOL</text>  <text class="sub" x="424" y="280">气缸输出_到位</text>
  <text class="cod" x="278" y="298">duHomeDebounce</text><text class="cod" x="380" y="298">UDINT</text><text class="sub" x="424" y="298">原位防抖时间</text>
  <text class="cod" x="278" y="316">duWorkDebounce</text><text class="cod" x="380" y="316">UDINT</text><text class="sub" x="424" y="316">工作位防抖时间</text>

  <text class="ok" fill="#5a3a8a" x="278" y="340">✅ 15个局部变量完整提取</text>
  <text class="sub" x="278" y="354">AI修改FB时不会产生命名冲突</text>

  <!-- ── Panel 3: Body ── x=528, w=260 -->
  <rect fill="#1a2635" x="528" y="48" width="260" height="20" rx="5"/>
  <text class="hdr" x="658" y="62" text-anchor="middle">③ 程序体 body.mnm</text>
  <rect fill="#0f1923" stroke="#2a3a50" stroke-width="1" x="528" y="68" width="260" height="488" rx="5" filter="url(#sh)"/>

  <text font-size="9" font-weight="600" fill="#7baed4" font-family="Consolas,monospace" x="536" y="84">;MODULE: FB_Cylinder  DEVICE: 60</text>
  <line x1="532" y1="88" x2="784" y2="88" stroke="rgba(255,255,255,.08)" stroke-width="1"/>

  <text class="cmt" x="536" y="102">;── 手动/自动上升沿触发 ──────────</text>
  <text class="cW"  x="536" y="116">LDP  CylinderCtrl.bExeToWorkManual</text>
  <text class="cW"  x="536" y="130">OUT  bManlWorkUp</text>
  <text class="cW"  x="536" y="144">LDP  CylinderCtrl.bExeToWorkAuto</text>
  <text class="cW"  x="536" y="158">OUT  bAutoWorkUp</text>
  <text class="cW"  x="536" y="172">LDP  CylinderCtrl.bExeToHomeManual</text>
  <text class="cW"  x="536" y="186">OUT  bManlHomeUp</text>

  <text class="cmt" x="536" y="204">;── 自复位（脉冲消除）──────────────</text>
  <text class="cW"  x="536" y="218">LD   CylinderCtrl.bExeToWorkManual</text>
  <text class="cW"  x="536" y="232">ANB  bManlWorkUp</text>
  <text class="cW"  x="536" y="246">RES  CylinderCtrl.bExeToWorkManual</text>

  <text class="cmt" x="536" y="264">;── 传感器屏蔽参数 ─────────────────</text>
  <text class="cW"  x="536" y="278">LDB  CylinderParam.bSensorType</text>
  <text class="cW"  x="536" y="292">OUT  bSrDisHome2</text>
  <text class="cW"  x="536" y="306">CON</text>
  <text class="cW"  x="536" y="320">OUT  bSrDisWork2</text>

  <text class="cmt" x="536" y="338">;── 设备状态判断 ───────────────────</text>
  <text class="cW"  x="536" y="352">LDB  MachineStatus.bAuto</text>
  <text class="cW"  x="536" y="366">ANDNB bFault1</text>
  <text class="cW"  x="536" y="380">ANDNB bFault2</text>
  <text class="cW"  x="536" y="394">OUT  CylinderStatus.bReady</text>

  <text font-size="9" fill="#7baed4" font-family="Consolas,monospace" x="536" y="416">✅ 基恩士专有指令原文保留</text>
  <text font-size="9" fill="#7baed4" font-family="Consolas,monospace" x="536" y="430">LDP / ANB / RES / LDB / CON</text>

  <!-- Bottom summary bar -->
  <rect fill="#0e3d6b" x="12" y="568" width="776" height="40" rx="6"/>
  <text font-size="11" font-weight="700" fill="#fff" x="400" y="584" text-anchor="middle">三份文件 · 一个功能块 · AI 得到完整的接口、内部状态与逻辑</text>
  <text font-size="10" fill="rgba(255,255,255,.75)" x="400" y="600" text-anchor="middle">arguments.tsv  ·  locals.tsv  ·  body.mnm — 三者合一，重建时原样还原</text>
</svg>
